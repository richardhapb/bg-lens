services:
  app:
    build: .
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_PASS=${MYSQL_PASS:-insecurepass}
  mysql:
    image: mysql:oraclelinux9
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASS:-insecurepass}
    ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pinsecurepass"]
      interval: 5s
      timeout: 5s
      retries: 10
